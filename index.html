<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EonPulse</title>
    <meta name="description" content="A minimal new tab page: local clock, search, shortcuts, and a running readout of deep time and space weather." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="gate" aria-hidden="true">eonpulse</div>

    <canvas id="bg-canvas"></canvas>

    <main id="app">
      <header class="topbar">
        <span class="wordmark">eonpulse</span>
        <a class="source-link" href="https://github.com/Nithish1201-code/EonPulse" target="_blank" rel="noopener">source</a>
        </header>

      <section class="hero">
        <h1 id="clock">--:--:--</h1>
        <p class="clock-date" id="clock-date">—</p>

        <form id="search-form" class="search-form" role="search">
          <input
            id="search-input"
            type="text"
            placeholder="search, or type a url"
            autocomplete="off"
            aria-label="Search the web or open a URL"
          />
        </form>
      </section>

      <nav class="shortcuts" id="shortcuts" aria-label="Quick links"></nav>

      <section class="stats-section" aria-label="Deep time and space weather readouts">
        <div class="stats" id="deep-time-section">
          <div class="stat-row">
            <span class="stat-label">age of the universe</span>
            <span class="stat-value" id="universe-age">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">earth, right now (utc)</span>
            <span class="stat-value" id="earth-time">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">mars, right now</span>
            <span class="stat-value" id="mars-time">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">until the sun becomes a red giant</span>
            <span class="stat-value" id="red-giant">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">solar activity <span class="chip" id="kp-chip">—</span></span>
            <span class="stat-value" id="kp-readout">connecting to NOAA space weather feed…</span>
          </div>
        </div>
      </section>
    </main>

    <button id="apod-widget" class="apod-widget" type="button" aria-haspopup="dialog" aria-label="Open today's NASA astronomy picture" hidden>
      <img id="apod-thumb" alt="" />
      <span class="apod-widget-date" id="apod-date"></span>
    </button>

    <div id="apod-lightbox" class="apod-lightbox" role="dialog" aria-modal="true" aria-label="NASA astronomy picture of the day" hidden>
      <div class="apod-lightbox-panel">
        <button id="apod-lightbox-close" class="apod-lightbox-close" type="button" aria-label="Close">×</button>
        <div id="apod-lightbox-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
