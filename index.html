<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EonBeat</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <main id="app">
      <header>
        <h1>EonBeat</h1>
        <p class="tagline">A live pulse from our very own Sol, beating against the age of time itself.</p>
      </header>

      <section id="pulse-section">
        <div id="pulse-dot"></div>
        <p id="pulse-readout">connecting to NOAA space weather feed...</p>
      </section>

      <section id="deep-time-section">
    <div class="stat"><span class="label">Age of the universe</span><span id="universe-age" class="value">—</span></div>
    <div class="stat"><span class="label">Earth, right now</span><span id="earth-time" class="value">—</span></div>
    <div class="stat"><span class="label">Mars, right now</span><span id="mars-time" class="value">—</span></div>
    <div class="stat"><span class="label">Until the Sun becomes a red giant</span><span id="red-giant" class="value">—</span></div>
    </section>
    </main>

  </body>
</html>
